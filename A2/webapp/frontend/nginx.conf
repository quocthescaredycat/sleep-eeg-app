server {
    listen 80;
    root /usr/share/nginx/html;

    # Slightly above the API's 64 MiB limit, so oversized uploads get the API's JSON error.
    client_max_body_size 70m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Resolve the api container through Docker's DNS on every request (cached 10 s), so a
    # recreated api container with a new IP is reached without restarting this one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # HTTP Basic Auth when BASIC_AUTH_USER and BASIC_AUTH_PASSWORD are set (compose.vps.yaml);
    # empty otherwise. Written at start-up by /docker-entrypoint.d/40-basic-auth.sh.
    include /etc/nginx/auth/basic.conf;

    # Open to uptime monitors: it only reports that the stack is up.
    location = /api/health {
        auth_basic off;
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes such as /recordings/<id> fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
